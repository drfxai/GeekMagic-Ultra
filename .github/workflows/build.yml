# Builds the SmallTV Ultra firmware in the cloud so you never have to install
# a compiler. Push this folder to a GitHub repo, open the Actions tab, wait
# about two minutes, then download the "firmware" artifact.
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # Cheap checks first: a two-minute firmware build is a slow way to find out
  # that the timezone table was edited without regenerating the picker.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Timezone picker is in sync with shared/timezones.json
        run: python tools/gen_timezones.py --check

      - name: Every POSIX rule matches the IANA database
        run: python tools/test_timezones.py

      - name: Python tools parse
        run: python -m compileall -q tools/

      - name: Worker parses
        run: node --check bridge/worker.js

  firmware:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ hashFiles('firmware/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build both images
        working-directory: firmware
        run: pio run -e smalltv_ultra -e smalltv_ultra_slim

      - name: Stage artifacts and report sizes
        run: |
          mkdir -p out
          cp firmware/.pio/build/smalltv_ultra/firmware.bin      out/drfx-godmode-smalltv-ultra.bin
          cp firmware/.pio/build/smalltv_ultra_slim/firmware.bin out/drfx-godmode-smalltv-ultra-SLIM.bin

          FULL=$(stat -c%s out/drfx-godmode-smalltv-ultra.bin)
          SLIM=$(stat -c%s out/drfx-godmode-smalltv-ultra-SLIM.bin)

          {
            echo "## Firmware images"
            echo ""
            echo "| Image | Size | Fits the stock OTA slot? |"
            echo "|---|---|---|"
            printf "| full | %s bytes (%s kB) | %s |\n" "$FULL" "$((FULL/1024))" \
              "$([ "$FULL" -le 450560 ] && echo 'likely' || echo 'NO - too big')"
            printf "| SLIM | %s bytes (%s kB) | %s |\n" "$SLIM" "$((SLIM/1024))" \
              "$([ "$SLIM" -le 450560 ] && echo 'likely' || echo 'NO - still too big')"
            echo ""
            echo "The 440 kB figure is the slot the stock GeekMagic Ultra firmware leaves"
            echo "for an over-the-air update - it reserves most of the chip for its photo"
            echo "album. It is a conservative estimate and varies between units, so a"
            echo "'NO' here means 'the stock updater will probably refuse this', not"
            echo "'this image is broken'."
            echo ""
            echo "If neither image fits, the first flash has to go over UART - see the"
            echo "recovery notes in vendor/README.md."
            echo "After that the device runs our layout with ~3 MB of program area, and"
            echo "every later update is a browser upload via Admin -> Firmware update."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "full = $FULL bytes, slim = $SLIM bytes"
          if [ "$SLIM" -gt 450560 ]; then
            echo "::warning::Slim image is $((SLIM/1024)) kB, over the ~440 kB OTA slot - first flash will need UART (see vendor/README.md)."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: out/*.bin
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.bin
