; DrFX GodMode - GeekMagic SmallTV Ultra (ESP-12F / ESP8266)
;
; Hardware, confirmed against the ESPHome device page for this board:
;   MCU      ESP-12F (ESP8266), 4 MB flash, no USB-serial chip
;   Panel    1.54" 240x240 IPS, ST7789V, BGR order, colours inverted, SPI mode 3
;   SPI      SCLK GPIO14, MOSI GPIO13, DC GPIO0, RST GPIO2, CS not wired
;   Backlight GPIO5, PWM, active low (inverted)
;
; Build:   pio run
; Output:  .pio/build/smalltv_ultra/firmware.bin
;
; You do not have to build this yourself - see .github/workflows/build.yml,
; which makes GitHub compile the .bin for you.

[env:smalltv_ultra]
platform  = espressif8266@^4.2.1
board     = esp12e
framework = arduino

; 4 MB flash split as 1 MB filesystem / 3 MB program area.
; This replaces the stock layout, so the stock photo album is erased.
board_build.ldscript   = eagle.flash.4m1m.ld
board_build.filesystem = littlefs
board_build.f_cpu      = 160000000L

monitor_speed = 115200
upload_speed  = 460800

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bblanchon/ArduinoJson @ ^7.2.0

build_flags =
    ; ---- keep the image small so it fits the stock Ultra OTA slot ----
    -Os
    -DNDEBUG
    ; Deliberately NOT using -DBEARSSL_SSL_BASIC. It saves about 40 kB, but it
    ; trims the cipher suite list, and a handshake that fails against
    ; Cloudflare is far harder for a user to diagnose than a slightly larger
    ; image. Likewise ATOMIC_FS_UPDATE is left off - it needs spare filesystem
    ; space during an update and this board has little to spare.

    ; ---- TFT_eSPI panel configuration (replaces User_Setup.h) ----
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DCGRAM_OFFSET=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_ON=1
    -DTFT_CS=-1
    -DTFT_DC=0
    -DTFT_RST=2
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000

; ---------------------------------------------------------------------------
; Slim build - the one that fits the stock Ultra's OTA slot.
;
; The stock firmware reserves ~3 MB of the flash for its photo album, so the
; space left for an over-the-air update is smaller than the full image. This
; env strips the biggest optional pieces to get under that ceiling:
;
;   BEARSSL_SSL_BASIC   ~45 kB  trims BearSSL's cipher suite list. Cloudflare
;                               negotiates fine with what remains.
;   no SMOOTH_FONT      ~18 kB  drops the anti-aliased font renderer
;   no LOAD_FONT6/7     ~15 kB  drops the 48px numerals and 7-segment clock;
;                               display.h falls back to font 4
;   GODMODE_SLIM        ~25 kB  leaves out mDNS, so use the IP address rather
;                               than godmode.local
;
; Flash this once through the stock web updater. Afterwards the device runs
; OUR layout (1 MB filesystem / ~3 MB program area), so there is plenty of
; room - update straight to the full build from Admin -> Firmware update and
; you get mDNS, the smooth fonts and the full cipher list back.
; ---------------------------------------------------------------------------
[env:smalltv_ultra_slim]
extends = env:smalltv_ultra

build_unflags =
    -DSMOOTH_FONT=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1

build_flags =
    ${env:smalltv_ultra.build_flags}
    -DBEARSSL_SSL_BASIC
    -DGODMODE_SLIM=1
